<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="96" height="96" fill="none">
  <!-- Outer architectural datum ring -->
  <circle cx="60" cy="60" r="46" stroke="#111113" stroke-opacity="0.12" stroke-width="1" />
  <!-- Cardinal precision ticks -->
  <line x1="60" y1="8" x2="60" y2="14" stroke="#111113" stroke-opacity="0.35" stroke-width="1" />
  <line x1="60" y1="106" x2="60" y2="112" stroke="#111113" stroke-opacity="0.35" stroke-width="1" />
  <line x1="8" y1="60" x2="14" y2="60" stroke="#111113" stroke-opacity="0.35" stroke-width="1" />
  <line x1="106" y1="60" x2="112" y2="60" stroke="#111113" stroke-opacity="0.35" stroke-width="1" />

  <!-- Primary crimson sweep arc -->
  <circle
    cx="60"
    cy="60"
    r="46"
    stroke="#c8102e"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-dasharray="72 220"
  >
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 60 60"
      to="360 60 60"
      dur="1.35s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- Inner counter-rotating carbon technical ring -->
  <circle
    cx="60"
    cy="60"
    r="30"
    stroke="#111113"
    stroke-opacity="0.78"
    stroke-width="1.25"
    stroke-linecap="round"
    stroke-dasharray="28 66"
  >
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="360 60 60"
      to="0 60 60"
      dur="2.1s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- Minimal center datum core -->
  <circle cx="60" cy="60" r="2.5" fill="#c8102e" />
</svg>
